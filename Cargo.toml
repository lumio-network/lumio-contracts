[workspace]
resolver = "2"
members = [
    "contracts/treasury",
    "contracts/governance",
    "contracts/dividends",
    "contracts/voting",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lumio-network/lumio-contracts"

[workspace.dependencies]
soroban-sdk = "27.0.6"

# Release profile tuned for small, deterministic Soroban wasm.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps debug assertions — handy when debugging a deploy.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
