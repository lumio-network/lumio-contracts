[package]
name = "lumio-voting"
description = "Lumio voting contract — vote casting and tallying used by governance."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
lumio-governance = { path = "../governance" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lumio-governance = { path = "../governance" }
